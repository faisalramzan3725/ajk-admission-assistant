# JK Assistance - machine-readable academic progression rules (versioned).
# The engine in jk_assistance/progression.py implements these. Each rule set has an effective cohort range
# so the correct version is chosen from the student's admission term.

rule_sets:
  - id: must.semester.v2017
    institution: must
    title: MUST General Regulations for degrees under the semester system (Chapter 26)
    effective_from_term: Spring-2017
    source: "https://must.edu.pk/?page_id=6258"
    trust: official
    grading:
      pass_percent: 50
      lab_and_theory_passed_separately: true
      credit_marks: 50
      assessment_breakup: {quiz: 10, assignment: 10, midterm: 30, terminal: 50}
      gp_table: "percent < 50 -> 0.00 (F); 50 -> 2.00; each whole percent adds 0.05; 90-100 -> 4.00"
      letter_bands: {"50": C-, "55": C, "60": C+, "65": B-, "70": B, "75": B+, "80": A-, "85": A, "90": A+}
      f_courses_excluded_from_percentage: true
      fraction_rounding: "A fraction in a course mark counts as 1 mark (64.5 -> 65)"
      weighted_average_rounding: none
      known_conflict: >
        The published worked example maps a 63.92 weighted average to GP 2.65 on the Grading System page
        ("https://must.edu.pk/?page_id=6252)" but to 2.70 on the Semester Rules page. Rule (7) says there is no rounding
        of the weighted average, so JK Assistance truncates (63.92 -> 63 -> 2.65) and flags the conflict whenever the
        weighted average has a fractional part >= 0.5.
    degree_requirements:
      min_cgpa: 2.5
      min_cumulative_percent: 57.5
      special_exam: "If all other requirements are met but the cumulative percent is below 57.5, the student may apply for a special examination and repeat up to 20% of courses; failing it = dropped without degree"
      attendance_min_percent: 75
      internship: "6-8 weeks after the final semester, S/U"
      comprehensive_oral: "S/U, re-conducted after 30 days of result on fee"
    promotion:
      threshold: "Pass at least 50% of the courses opted in the semester (regular + re-enrolled). Fractions are rounded to the nearest whole course (JK Assistance rounds x.5 up)."
      programs:
        bs4:   {promotion_semesters: [1, 7], first_half: [1, 4], second_half: [5, 8], normal_semesters: 8, failed_courses_until: 14}
        bs5:   {promotion_semesters: [1, 8], first_half: [1, 4], second_half: [5, 8], normal_semesters: 10, failed_courses_until: 16}
        bs3:   {promotion_semesters: [1, 5], first_half: [1, 4], second_half: [5, 6], normal_semesters: 6, failed_courses_until: 9}
        master2: {promotion_semesters: [1, 3], first_half: [1, 3], second_half: null, normal_semesters: 4, failed_courses_until: 6, max_probations: 1}
      outcomes:
        - "Semester 1 below threshold -> probation (first probation)"
        - "Semester 2 below threshold while on probation -> dropped (re-admission in semester 1 allowed once, or fresh admission on merit)"
        - "Semester 3 or 4 below threshold while first probation still exists -> relegated to semester 3"
        - "Semester 5 below threshold -> probation (second probation)"
        - "Semester 6 below threshold while on probation -> relegated to semester 5"
        - "Semester 7 (and 8 for 5/6-year programs) below threshold while on probation -> relegated to semester 7"
        - "Passing the threshold after a summer semester waives the probation"
        - "First probation does not carry into the second half of the program"
        - "Re-admission and relegation are granted once each, and at most two probations in the whole program (one in master programs)"
      mphil:
        - "GPA >= 2.50 after semester 1 -> continue; 2.25-2.49 -> probation; < 2.25 -> dropped"
        - "Semester 2 CGPA 2.25-2.49 -> probation into semester 3, but if already on probation -> dropped"
    max_duration_semesters:
      bsc_engineering: 14
      bsc_technology: 10
      pharm_d: 14
      bs_bba_bsc: 12
      ba_llb: 14
      bs_home_economics_6yr: 16
      master_2yr: 6
    course_load: "4-6 courses (15-24 credits) per normal semester; summer max 12 credit hours; Pharm-D max 30/15"
    attendance: "Below 75% attendance in lectures or practicals (separately) -> dropped from the course; no leave counts toward attendance"
    improvement: "Courses below B grade may be repeated to improve; overall below B allows a special exam of 20% of courses within the maximum duration"

  - id: uajk.semester.unpublished
    institution: uajk
    title: UAJK semester promotion / probation rules
    trust: official
    status: not_published
    note: >
      UAJK has not published its semester promotion/probation regulations online (checked: website pages, Prospectus 2022-23,
      Undergraduate Education Policy V1.1). JK Assistance therefore does not predict promotion for UAJK students; it escalates
      such questions to the student's department / Semester Desk (05822-960506). The HEC Undergraduate Education Policy that UAJK
      published sets: 120-144 credit hours for a BS (normally 15-18 per semester, max 21), 30 credit hours of general education in
      the first four semesters, a mandatory 3-credit internship and 3-credit capstone, and minimum CGPA 2.00/4.00 for an
      Associate Degree (4-6 regular semesters).
    source: https://uajk.edu.pk/wp-content/uploads/2025/07/UGE-Policy.pdf

  - id: uhs.mbbs.unpublished_here
    institution: uhs
    title: MBBS/BDS professional examination promotion rules
    status: not_collected
    note: MBBS/BDS promotion follows the affiliating university's (UHS) annual/modular professional exam regulations, which JK Assistance has not ingested. Escalate to the college examination cell.
