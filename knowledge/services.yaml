  - id: uajk.migration
    institution: uajk
    name: Migration certificate / NOC (leaving UAJK for another university)
    keywords: [migration, migration certificate, noc, no objection certificate, leave university, transfer to another university]
    office: Assistant Registrar (General), General Section, Admin Block Chellah Campus (05822-960425)
    forms:
      - {title: Migration Certificate Form, local: documents/uajk/Migration_Certificate_Form.pdf, url: https://uajk.edu.pk/wp-content/uploads/2025/10/Migration-form-up-dated.pdf}
    fees:
      - {item: "Migration certificate (ordinary, within 2 weeks)", versions: [{amount: 5800, effective_from: 2025-10-01, date_basis: form published 2025-10, source: https://uajk.edu.pk/wp-content/uploads/2025/10/Migration-form-up-dated.pdf}]}
      - {item: Duplicate migration certificate (within 2 weeks), versions: [{amount: 17700, effective_from: 2025-10-01, date_basis: form published 2025-10, source: https://uajk.edu.pk/wp-content/uploads/2025/10/Migration-form-up-dated.pdf}]}
    required_documents:
      - Migration Certificate Form, attested by the principal/head of institution (regular students) or a first-class Gazetted Officer (private candidates)
      - Original HBL challan pasted on the form at the marked place (deposited in UAJK's normal account; challans for another university's account are not accepted). Overseas candidates may attach an original HBL bank draft in favour of Director Finance & Planning, UAJK.
      - Attested clear copies of the last result card / degree available
      - Attested copy of CNIC
      - If attaching a fail result card and remaining chances were not availed - affidavit on stamp paper attested by an oath commissioner
      - For duplicate migration (within one year of the first) - FIR, two original national newspaper advertisements, and a court-attested affidavit that the first certificate was lost and not used
    steps:
      - Pay the fee in UAJK's normal account through an HBL challan.
      - Fill and get the form attested; paste the challan; attach documents.
      - Send the case within 15 days of paying the fee, addressed to the Assistant Registrar (General), UAJK Muzaffarabad.
    deadlines:
      - {rule: Submit the case within 15 days after depositing the fee, days_after_payment: 15}
    sources: [https://uajk.edu.pk/wp-content/uploads/2025/10/Migration-form-up-dated.pdf, https://challan.uajk.edu.pk/]
    trust: official

  - id: uajk.transfer
    institution: uajk
    name: Transfer / migration between universities or colleges (university-to-university, college-to-college, university-to-college)
    keywords: [transfer, university to university, college to college, university to college, credit transfer, shift university]
    office: Registrar Office, General / Registration Section (05822-960425)
    forms:
      - {title: University To University Transfer Form, local: documents/uajk/University_To_University_Transfer_Form.pdf, url: https://uajk.edu.pk/wp-content/uploads/2024/11/UNIVERSITY-TO-UNIVERSITY-MIGRATION-Update-1.pdf}
      - {title: College To College Transfer Form, local: documents/uajk/College_To_College_Transfer_Form.pdf, url: https://uajk.edu.pk/wp-content/uploads/2024/11/College-to-college-Migration-updated.pdf}
      - {title: University To College Transfer Form, local: documents/uajk/University_To_College_Transfer_Form.pdf, url: https://uajk.edu.pk/wp-content/uploads/2024/11/UNIVERSITY-TO-COLLEGE-New.pdf}
    fees:
      - {item: University-to-university transfer application (non-refundable), versions: [{amount: 5300, effective_from: 2024-11-01, date_basis: form published 2024-11, source: https://uajk.edu.pk/wp-content/uploads/2024/11/UNIVERSITY-TO-UNIVERSITY-MIGRATION-Update-1.pdf}]}
    required_documents:
      - Transfer form sent through the principal / chairman / dean where the student is enrolled (they certify the statement)
      - Sanction (no-objection) of the head of the department/college the student wants to join
      - Original university fee receipt (no form is entertained without it)
      - Registration return with usual fees, if not already forwarded
      - Medical certificate, if the reason is illness
    notes:
      - The leaving certificate is not issued until the Vice-Chancellor sanctions the transfer; admission without that sanction is invalid.
      - Detained/degraded students or those facing disciplinary action must have this stated by the principal.
    escalate_when: [Every transfer - it requires Vice-Chancellor sanction and credit-transfer decisions by the department]
    sources: [https://uajk.edu.pk/wp-content/uploads/2024/11/UNIVERSITY-TO-UNIVERSITY-MIGRATION-Update-1.pdf]
    trust: official

