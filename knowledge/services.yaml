# JK Assistance - student services catalog (documents, fees, steps) per institution.
#
# Fees are VERSIONED: each fee has one or more versions with `effective_from`. The engine selects the
# newest version whose effective_from <= the date of the question. When a fee's effective date is
# unknown, `effective_from` is the date the source was published/fetched and `date_basis` says so.
# Never quote a fee without its source and version date.
#
# Form paths are relative to the project root.

services:

  # ------------------------------------------------------------------ UAJK
  - id: uajk.degree
    institution: uajk
    name: Degree issuance (original degree)
    keywords: [degree, original degree, get my degree, degree before convocation, degree after convocation, urgent degree, degree issuance]
    office: Degree Branch, Examinations Department, Admin Block, Chellah Campus Muzaffarabad (05822-960477, deputy.controller.degree@uajk.edu.pk)
    forms:
      - {title: Degree Form (Degree Branch Examinations Department), local: documents/uajk/Degree_Form_Degree_Branch_Examinations_Department.pdf, url: https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Form.pdf}
    fees:
      - {item: Degree before convocation, versions: [{amount: 8800, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Degree after convocation, versions: [{amount: 4400, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Urgent degree (within 10 working days), versions: [{amount: 13200, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Associate Degree Arts (per student), versions: [{amount: 2900, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Associate Degree Commerce (per student), versions: [{amount: 7300, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Associate Degree Science (per student), versions: [{amount: 4800, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
      - {item: Change of degree pattern (old design to new design), versions: [{amount: 9900, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
    required_documents:
      - Completed Degree Form (name and father's name in English block letters and in Urdu, CNIC, registration no., roll no., examination/session, marks/CGPA)
      - Paid HBL challan (or HBL bank draft) - challan no. and date written on the form
      - No-objection attestation on the form by Dean / Chairman / Director / Coordinator / Principal (regular or college candidates) OR by a Gazetted Officer Class-I (external/private candidates), with name, designation, department and CNIC of the attesting officer
      - Postal/correspondence address slip (bottom of the form) - the degree is dispatched to this address
    steps:
      - Generate the challan for the correct degree fee head at https://challan.uajk.edu.pk/ and pay at any HBL branch.
      - Fill the Degree Form and get it attested (department/college head for regular students; Gazetted Officer Class-I for private candidates).
      - Submit the form with the paid challan to the Degree Branch, Examinations Department.
    notes:
      - The degree form's attestation ("no objection regarding issuance of this candidate's degree") is UAJK's departmental clearance step for degrees; UAJK does not publish a separate student clearance form online.
    sources: [https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Form.pdf, https://challan.uajk.edu.pk/]
    trust: official

  - id: uajk.degree_verification
    institution: uajk
    name: Verification of Degree / DMC / Result Intimation / Merit or Position certificate / Gold Medal certificate
    keywords: [verification, verify degree, degree verification, dmc verification, hec attestation verification, verify transcript]
    office: Degree Branch, Examinations Department (05822-960477, deputy.controller.degree@uajk.edu.pk)
    forms:
      - {title: Application Form for Verification / Correction of Degree / Revised / Duplicate Degree, local: documents/uajk/Application_Form_For_Verification_Correction_of_Degree_Revised_Duplica.pdf, url: https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Verification-Form.pdf}
    fees:
      - {item: Verification of Degree / DMC / Result Intimation, versions: [{amount: 3300, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
    required_documents:
      - Photocopy of the Degree / DMC / Result Intimation (or Merit/Position certificate and Gold Medal certificate) to be verified
      - Photocopy of CNIC
      - Original paid HBL challan / bank draft
    steps:
      - Pay the verification fee via https://challan.uajk.edu.pk/ (HBL).
      - Fill Part A (Verification) of the form and attach the documents above.
      - Submit to the Degree Branch; queries by email to deputy.controller.degree@uajk.edu.pk.
    sources: [https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Verification-Form.pdf, https://uajk.edu.pk/examination-department/]
    trust: official

  - id: uajk.duplicate_degree
    institution: uajk
    name: Duplicate degree (lost / damaged degree)
    keywords: [duplicate degree, lost degree, degree lost, damaged degree, second copy degree]
    office: Degree Branch, Examinations Department (05822-960477)
    forms:
      - {title: Application Form for Verification / Correction of Degree / Revised / Duplicate Degree (Part C), local: documents/uajk/Application_Form_For_Verification_Correction_of_Degree_Revised_Duplica.pdf, url: https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Verification-Form.pdf}
    fees:
      - {item: Duplicate degree, versions: [{amount: 19800, effective_from: 2026-09-29, date_basis: fetched, source: https://challan.uajk.edu.pk/}]}
    required_documents:
      - Photocopy of Degree / DMC / Result Intimation
      - Advertisement of the loss in 2 national newspapers
      - Copy of the original F.I.R.
      - Affidavit
      - Original bank challan / draft
      - Photocopy of CNIC
    steps:
      - Report the loss to police (FIR) and publish the loss notice in two national newspapers.
      - Prepare an affidavit, pay the duplicate-degree fee (HBL challan), fill Part C of the form and submit to the Degree Branch.
    sources: [https://uajk.edu.pk/wp-content/uploads/2025/10/Degree-Verification-Form.pdf, https://challan.uajk.edu.pk/]
    trust: official

