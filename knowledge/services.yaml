      - Attested copy of Secondary School Certificate (SSC)
      - Attested copy of Detailed Marks Certificate (DMC)
      - Attested copy of CNIC
      - Clearance Certificate from the department (regular university students only) - see must.clearance
      - Original internship letter of minimum 3 months (compulsory for B.Com and ADC annual-system students)
      - Paid HBL/ABL challan or bank draft (amount in digits and words on the form)
      - Attestation by Dean / Chairman / Director / Coordinator / Principal (regular/college) or Gazetted Officer Class-I (external/private)
    steps:
      - Get your departmental Clearance Certificate signed by all offices (must.clearance).
      - Pay the degree fee for your case (before/after convocation or urgent).
      - Fill the Degree Form, get it attested and attach the documents.
      - Submit to the Controller of Examinations. The degree is posted to the postal address on the form (not the CNIC address).
    processing_time: About 2 months from receipt of a complete application; urgent degree about 20-35 days. Incomplete forms are not entertained.
    notes:
      - If you cannot collect it yourself, an authorised person may collect the degree with an original affidavit on stamp paper and the degree holder's original CNIC.
      - Fee versions - the 28 July 2026 schedule applies "to all sessions from 28 July 2026"; earlier payments followed the 2 Sept 2024 schedule.
    sources: [https://must.edu.pk/wp-content/uploads/2026/08/Degree-from-updates.pdf, https://must.edu.pk/wp-content/uploads/2024/09/Miscellaneous-Fee-Structure-2024.pdf]
    trust: official

