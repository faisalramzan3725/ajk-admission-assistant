tests:
  uajk_entry_test:
    name: UAJK Entry Test
    applies_to: UAJK programs "where applicable" (engineering, health sciences, most BS)
    passing: 50%
    fee: Rs. 1,000 for the first program + Rs. 200 per additional program (included in the online challan)
    note: Candidates report to the campus they applied to for the test; no separate call letter is issued. Sample paper - https://uajk.edu.pk/admission-procedure/
    source: https://uajk.edu.pk/admission-procedure/
  must_seet:
    name: MUST State Entry Examination Test (SEET)
    portal: http://seet.must.edu.pk/
    applies_to: MUST engineering (PEC-approved test, 33% minimum) and MIT engineering-technology programs (state-level entry test conducted by MUST)
    passing: 33% for engineering programs
    source: https://must.edu.pk/wp-content/uploads/2026/08/Eligibility-Criteria-for-Admission-in-UG-Fall-2026-Faculty-Wise.pdf
  mdcat:
    name: MDCAT (Medical & Dental Colleges Admission Test, conducted under PM&DC)
    applies_to: MBBS and BDS
    passing: 55% for MBBS, 50% for BDS (as reported for the JAC AJK cycle)
    trust: secondary
    source: https://gotest.com.pk/admissions/ajk-mbbs-bds-admission-2025-joint-admission-committee/
  hec_lat:
    name: HEC Law Admission Test (LAT)
    applies_to: LLB (UAJK - 50% required), BA LLB (MUST - as per HEC requirement)
    source: https://uajk.edu.pk/eligibility-criteria/
  ntc_interview:
    name: Entry test + interview (NTC-accredited technology programs, UAJK)
    applies_to: UAJK B.Sc. Engineering Technology programs
    source: https://uajk.edu.pk/eligibility-criteria/

application_process:
  uajk:
    portal: https://admissions.uajk.edu.pk/
    how_to_apply:
      - Apply online at https://admissions.uajk.edu.pk/ (or collect a hard-copy form from the DSA office, Chellah Campus).
      - Generate the online challan - Rs. 3,000 for the first program, plus Rs. 1,000 per additional program; entry test fee Rs. 1,000 + Rs. 200 per additional program is added automatically. Pay at any HBL branch.
      - Payment against the FIRST challan is mandatory - an application is not accepted if only the 2nd/3rd challans are paid.
      - Online applicants must also send printed copies of each application, with the challan copy and documents, to the Directorate of Students' Affairs (or their campus).
      - Appear in the entry test at your campus (where applicable). Merit lists are displayed on DSA / department notice boards and the website; no admission letter is issued.
      - Bring ORIGINAL documents for verification at the interview.
    required_documents:
      - Attested copies of all educational certificates and degrees
      - Character certificate from the college/institute last attended
      - NOC / migration certificate if HSSC is from a board other than BISE Mirpur AJ&K
      - Copy of Domicile and State Subject certificate
      - Copy of CNIC or Form-B
      - Four recent passport-size photographs
      - Copy of guardian's CNIC
      - NOC from employer (government/other employees); study leave certificate for full-time study
      - Relevant nomination/certificate for reserved seats (see reserved_seats)
    age_limit: Maximum 23 years for BS programs (Prospectus 2022-23 - confirm with the current advertisement)
    reserved_seats:
      - Open merit (AJK nationals) 31 per discipline; self-support 6 per discipline
      - Children of armed forces 2 (GHQ nomination); children of school teachers 1 and college teachers 1 (Secretariat of Colleges AJ&K); children of university employees 1 and university teachers 1 (VC office)
      - Physically disabled 1 (university medical board); sports 1 (university sports committee)
      - Gilgit-Baltistan 4; FATA 2; Punjab 1; KPK 1; Sindh 1; Balochistan 1 (concerned nomination boards)
      - AJK nationals settled abroad / overseas 1 (valid OPF membership)
      - Nominations must reach the DSA within the time given in the advertisement; late submissions are not accepted
    self_support: Self-support (payment) seats pay the normal fee PLUS the self-support fee (Rs. 25,000 per semester for most BS; Rs. 40,000 for DPT/Pharm-D, Nursing, Cyber Security), paid in a single demand draft in favour of Director Finance, UAJK. Selection is on merit; AJK nationals and refugees settled in Pakistan get preference.
    scholarships:
      - Merit scholarship / tuition fee rebate 2026-27 (undergraduate) - top 3 students in each program get 50%, 40% and 30% tuition fee rebate
      - Need-based and external scholarships through the Directorate of Student Financial Assistance (HEC need-based, PEEF, Muslim Hands, HBL Foundation) - https://uajk.edu.pk/directorate-students-financial-assistance/
    fee_payment_rule: 2nd semester onward - fee without fine up to the end of the 3rd week after classes start; with a 10% fine from the 4th to the end of the 6th week. After the normal 8 semesters, an extra semester with up to 3 courses costs Rs. 7,000 per course; more than 3 courses = full last-semester fee.
    fee_note: UAJK says fees typically rise by about 10% per year; the figures here are for sessions starting 2025 (notification of 12 Sept 2025).
    sources: [https://uajk.edu.pk/admission-procedure/, https://uajk.edu.pk/required-documents/, https://uajk.edu.pk/reserved-seats/, https://uajk.edu.pk/merit-scholarship-tuition-fee-rebate/, https://uajk.edu.pk/fee-structure/]
  must:
    portal: https://admission.must.edu.pk/
    how_to_apply:
      - Apply online at https://admission.must.edu.pk/ and register for SEET (http://seet.must.edu.pk/) where an entry test is required.
      - Choose a category - Subsidized (merit-based, normal fee) or Open Merit (self-financing, pays the additional non-subsidized tuition fee).
      - Check merit lists at https://admission.must.edu.pk/meritlist.php.
      - After selection, the admission committee chairperson verifies ORIGINAL documents; then deposit the admission fee through the bank challan.
    required_documents:
      - Attested academic certificates / result cards (SSC, HSSC)
      - NOC if F.A./F.Sc. (or equivalent) was passed from a board other than BISE Mirpur AJ&K
      - CNIC / Form-B and domicile/State Subject (confirm with the current advertisement)
      - New Student's Undertaking (affidavit) - https://must.edu.pk/wp-content/uploads/2025/09/newstudentUndertaking-1.pdf
      - Medical certificate - https://must.edu.pk/wp-content/uploads/2025/09/medical_certificate-1.pdf
    age_limit: 24 years after 12 years of education; 26 years after 14 years (at the closing date of applications)
    contacts: DSA admission office 05827-961045, 0355-8083673, 0333-9571065, dsa@must.edu.pk
    fee_note: Fees are from the MUST Prospectus 2024-25 (session 2024-25); expect revision for Fall 2026.
    sources: [https://must.edu.pk/admissions/, "https://must.edu.pk/?page_id=6258", https://must.edu.pk/wp-content/uploads/2024/11/E-Prospectus_2024-25.pdf, https://must.edu.pk/downloads/]
  jac_medical:
    portal: https://jac.ajk.gov.pk/
    how_to_apply:
      - Pass MDCAT (MBBS 55%, BDS 50%) in your domicile region.
      - Apply ONLINE on the JAC AJ&K portal (no paper applications) - register with email, fill the profile, upload scanned documents, set college preferences (they cannot be changed after submission).
      - Pay the processing fee (reported as Rs. 3,000 + Rs. 400 IT charges via Easy Paisa / debit card / online banking).
      - Follow the provisional merit list and selection lists notified by the JAC Muzaffarabad secretariat.
    merit_formula: {ssc: 10, hssc: 40, mdcat: 50, trust: secondary}
    required_documents:
      - Secondary School Certificate (SSC) and result card
      - HSSC / F.Sc. (Pre-Medical) certificate and result card (A-level needs an IBCC equivalence certificate)
      - Official MDCAT result card (valid for the current session)
      - State Subject certificate (Class-I) and domicile (AJ&K); Permanent Resident Certificate (PRC)
      - Candidate's CNIC / Form-B and guardian's CNIC
      - 8 passport-size photographs with blue background
      - Different-abilities certificate (if applicable)
    eligibility: Minimum 60% in F.Sc. Pre-Medical (or equivalent); First Class State Subject of AJ&K for AJK-national seats (separate rules for overseas / foreign / refugee categories).
    note: Official guideline PDFs (Cloudflare-protected, open in a browser) - https://jac.ajk.gov.pk/wp-content/uploads/2025/11/GUIDELINE-FOR-ADMISSION-OF-MBBS-BDS-AJK-STATE-SUBJECT.pdf and https://jac.ajk.gov.pk/wp-content/uploads/2024/08/Guideline-Regarding-Admission-AJK-Nationals.pdf
    sources: [https://pmcrajk.edu.pk/admission.php, https://gotest.com.pk/admissions/ajk-mbbs-bds-admission-2025-joint-admission-committee/]
    trust: documents list and eligibility official (PMC); merit formula, fee, MDCAT thresholds secondary

