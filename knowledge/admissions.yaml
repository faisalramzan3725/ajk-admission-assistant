# JK Assistance - admissions knowledge for students who have completed 12 years of education (HSSC/FSc/FA/ICS/I.Com/DAE/A-level).
#
# groups vocabulary: pre_eng, pre_med, ics, fa, icom, general_science, dae, a_level
# min_percent: minimum HSSC (or equivalent) aggregate percent. null = the institution does not publish it (ask the office).
# fees.first_semester: total payable in the 1st semester for the normal/subsidized seat, with its session and source.
# demand: high / normal - used only by the heuristic chance estimate; it is NOT an official closing merit.
retrieved_on: 2026-09-29

