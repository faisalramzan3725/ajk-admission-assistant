# JK Assistance - admission knowledge for students who have completed 12 years of education.
#
# groups: pre_eng, pre_med, ics, fa, icom, general_science, dae, a_level
# min_percent: minimum HSSC/equivalent percentage (null = not published; ask the office)
# test_rules: the student must satisfy ANY ONE rule: {test: <id>, min_percent: N}
# fees.first_semester: 1st-semester total for the normal (merit/subsidized) seat; session + source given.
# demand: high / normal - only used by the heuristic chance label (no official closing merit is published).
retrieved_on: 2026-09-29

groups:
  pre_eng: F.Sc. Pre-Engineering
  pre_med: F.Sc. Pre-Medical
  ics: ICS (Intermediate in Computer Science)
  fa: F.A. (Intermediate Arts / Humanities)
  icom: I.Com (Intermediate in Commerce)
  general_science: Intermediate General Science
  dae: DAE (Diploma of Associate Engineer, 3 years)
  a_level: A-level (with IBCC equivalence)

tests:
  mdcat:
    name: MDCAT (Medical & Dental Colleges Admission Test)
    max_marks: 180
    format: "180 MCQs, 1 mark each, NO negative marking - Biology 81, Chemistry 45, Physics 36, English 9, Logical reasoning 9; paper-based, in English"
    passing:
      mbbs: {percent: 55, marks: 99}
      bds: {percent: 50, marks: 90}
      relaxation: "Session 2025-26 only: PM&DC allowed up to 3% lower (MBBS 52% = 94 marks, BDS 47% = 85 marks) ONLY to fill seats left vacant after all eligible candidates (notification 8 April 2026)"
    conducted_for_ajk_by: SZABMU Islamabad - test centres in Muzaffarabad, Rawalakot and Mirpur (you must test in your domicile region)
    registration: https://mdcat.pmdc.pk
    fee: "PKR 9,000 (late PKR 13,000); international centre PKR 45,000 (late 55,000) - non-refundable"
    dates_2026: "Registration 22 June - 8 July 2026 (extended to 13 July, late fee till 18 July); test rescheduled from 16 August to 20 September 2026"
    merit_formula: {mdcat: 50, hssc: 40, ssc: 10}
    sources:
      - "https://pmdc.pk/Documents/Others/Public%20Notice%20Regarding%20Opening%20of%20Online%20Registration%20Portal%20for%20MDCAT-2026.pdf"
      - "https://pmdc.pk/Documents/law/Admissions%20Regulations-2025.pdf"
      - "https://pmdc.pk/Documents/Others/Notification%20regarding%20timeline%20Extension%20&%20Reduction%20of%20MDAT%20passing%20Percentage%20for%20Session%202025-26..pdf"
      - "https://pmdc.pk/Documents/press/PRESS%20RELEASE-MDCAT%20Rescheduled.pdf"
    trust: official
  ecat:
    name: ECAT (UET Engineering College Admission Test)
    max_marks: 400
    format: "100 MCQs x 4 marks = 400; 1 mark deducted per wrong answer (negative marking)"
    passing:
      pec_engineering: {percent: 33, marks: 132, note: "PEC minimum for accredited engineering programs (MUST states 33% in a test by a PEC-approved testing body)"}
    reference_averages_fall_2026_first: {pre_eng: 203, ics: 201, pre_med: 222, note: "UET official statistics, ECAT Fall 2026 (first) - averages of all candidates by group"}
    use_in_ajk: "MUST engineering accepts a test by a PEC-approved testing body; confirm with MUST DSA (05827-961045) that your ECAT score is accepted for the current intake. UAJK engineering uses its own entry test."
    registration: https://ecat.uet.edu.pk/
    sources: ["https://ecat.uet.edu.pk/statsECATFirst.pdf", "https://must.edu.pk/wp-content/uploads/2026/08/Eligibility-Criteria-for-Admission-in-UG-Fall-2026-Faculty-Wise.pdf"]
    trust: "official (total marks, averages, 33% PEC rule); negative-marking detail from maqsad.io (secondary)"
  must_seet:
    name: MUST SEET (State Entry Examination Test)
    max_marks: null
    passing:
      engineering: {percent: 33}
    portal: http://seet.must.edu.pk/
    note: "Conducted by MUST as a PEC-approved testing body for its engineering and engineering-technology programs. Total marks are shown on your result card."
    sources: ["https://must.edu.pk/wp-content/uploads/2026/08/Eligibility-Criteria-for-Admission-in-UG-Fall-2026-Faculty-Wise.pdf"]
    trust: official
  uajk_entry_test:
    name: UAJK Entry Test
    max_marks: null
    passing:
      general: {percent: 50}
    fee: "Rs. 1,000 for the first program + Rs. 200 per additional program (added to the online challan)"
    note: "Taken at the campus you applied to; no separate call letter. Sample paper on https://uajk.edu.pk/admission-procedure/"
    sources: ["https://uajk.edu.pk/admission-procedure/", "https://uajk.edu.pk/eligibility-criteria/"]
    trust: official
  hec_lat:
    name: HEC Law Admission Test (LAT)
    max_marks: null
    passing:
      uajk_llb: {percent: 50}
    note: "Required for LLB / BA-LLB. UAJK requires 50% in LAT; MUST requires LAT as per HEC requirements."
    sources: ["https://uajk.edu.pk/eligibility-criteria/", "https://must.edu.pk/wp-content/uploads/2026/08/Eligibility-Criteria-for-Admission-in-UG-Fall-2026-Faculty-Wise.pdf"]
    trust: official

application_process:
  uajk:
    portal: https://admissions.uajk.edu.pk/
    steps:
      - {step: Check eligibility, detail: "Match your HSSC group and marks with the program (see the results table)."}
      - {step: Apply online, detail: "Create an account and fill the form at https://admissions.uajk.edu.pk/ (or collect a hard-copy form from the DSA office, Chellah Campus)."}
      - {step: Pay the challan, detail: "Rs. 3,000 for the first program + Rs. 1,000 per additional program; entry test Rs. 1,000 + Rs. 200 per extra program is added automatically. Pay at any HBL branch. The FIRST challan must be paid - applications with only later challans paid are rejected."}
      - {step: Send printed copies, detail: "Online applicants also send a printed copy of each application with the challan copy and attested documents to the Directorate of Students' Affairs (or their campus)."}
      - {step: Entry test, detail: "Appear at the campus you applied to (where a test applies; 50% to pass). No call letter is issued - watch the website."}
      - {step: Merit list, detail: "Merit lists are displayed on DSA / department notice boards and the website; no admission letter is issued."}
      - {step: Interview and verification, detail: "Bring ORIGINAL documents for verification (engineering/DPT also have an interview)."}
      - {step: Deposit fee and enrol, detail: "Pay the 1st-semester fee by the date on the merit list. Self-support seats pay the normal fee + the self-support fee by demand draft to Director Finance, UAJK."}
    required_documents:
      - Attested copies of all educational certificates (SSC, HSSC result cards/certificates)
      - Character certificate from the college/institute last attended
      - NOC / migration certificate if HSSC is from a board other than BISE Mirpur AJ&K
      - Copy of Domicile and State Subject certificate
      - Copy of CNIC or Form-B
      - Four recent passport-size photographs
      - Copy of guardian's CNIC
      - NOC from employer if employed (study leave for full-time study)
      - Nomination/certificate for any reserved-seat category
    age_limit: 23 years for BS programs (Prospectus 2022-23 - confirm in the current advertisement)
    reserved_seats: "Per department: open merit 31, self-support 6, armed forces children 2 (GHQ), school-teacher child 1, college-teacher child 1, university-employee child 1, university-teacher child 1, disabled 1, sports 1, Gilgit-Baltistan 4, FATA 2, Punjab 1, KPK 1, Sindh 1, Balochistan 1, AJK overseas (OPF) 1. Nominations must reach DSA before the advertised date."
    scholarships: "Merit rebate 2026-27: top 3 students in each undergraduate program get 50% / 40% / 30% tuition rebate. Need-based: HEC need-based, PEEF, Muslim Hands, HBL Foundation via the Directorate of Student Financial Assistance."
    fee_rules: "Fees shown are for sessions starting 2025 (UAJK notification of 12 Sept 2025); UAJK notes fees typically rise about 10% per year. From the 2nd semester, fee is due by the end of week 3 of classes; 10% fine from week 4 to week 6."
    sources: ["https://uajk.edu.pk/admission-procedure/", "https://uajk.edu.pk/required-documents/", "https://uajk.edu.pk/reserved-seats/", "https://uajk.edu.pk/merit-scholarship-tuition-fee-rebate/", "https://uajk.edu.pk/wp-content/uploads/2025/09/bs-all.pdf"]
    trust: official
  must:
    portal: https://admission.must.edu.pk/
    steps:
      - {step: Check eligibility, detail: "Match your group and marks (MUST Fall 2026 eligibility criteria)."}
      - {step: Register for the entry test, detail: "Engineering and engineering-technology need a PEC-approved test (MUST SEET at http://seet.must.edu.pk/; ask DSA whether an ECAT score is accepted)."}
      - {step: Apply online, detail: "Apply at https://admission.must.edu.pk/ and choose your category - Subsidized (merit, normal fee) or Open Merit (self-financing, pays additional tuition)."}
      - {step: Merit lists, detail: "Check https://admission.must.edu.pk/meritlist.php on the scheduled dates."}
      - {step: Document verification, detail: "The admission committee chairperson verifies your ORIGINAL documents."}
      - {step: Deposit admission fee, detail: "Deposit the fee through the bank challan after verification."}
      - {step: Enrolment forms, detail: "Submit the New Student's Undertaking (affidavit) and the Medical Certificate."}
    required_documents:
      - Attested SSC and HSSC certificates / result cards
      - NOC if F.A./F.Sc. was passed from a board other than BISE Mirpur AJ&K
      - CNIC / Form-B and domicile / State Subject (confirm with the advertisement)
      - New Student's Undertaking (affidavit) - https://must.edu.pk/wp-content/uploads/2025/09/newstudentUndertaking-1.pdf
      - Medical Certificate - https://must.edu.pk/wp-content/uploads/2025/09/medical_certificate-1.pdf
    age_limit: 24 years after 12 years of education; 26 years after 14 years (at the closing date)
    refund: "1st-semester tuition only: 100% up to day 7 after classes start, 50% on days 8-15, nothing from day 16; other charges are not refundable."
    fee_rules: "Fees shown are from the MUST Prospectus 2024-25; expect revision for Fall 2026."
    sources: ["https://must.edu.pk/admissions/", "https://must.edu.pk/?page_id=6258", "https://must.edu.pk/wp-content/uploads/2024/11/E-Prospectus_2024-25.pdf", "https://must.edu.pk/wp-content/uploads/2022/12/Refund-of-Fee-Form.pdf"]
    trust: official
  jac:
    portal: "https://jac.ajk.gov.pk/ (NOT WORKING - use the channels below)"
    steps:
      - {step: Pass MDCAT, detail: "Register at https://mdcat.pmdc.pk (PKR 9,000) and sit the test in your domicile region - SZABMU conducts it for AJK at Muzaffarabad, Rawalakot and Mirpur. You need 99/180 for MBBS or 90/180 for BDS."}
      - {step: Compute your merit, detail: "PM&DC formula - MDCAT 50% + HSSC 40% + SSC 10%."}
      - {step: Apply to the AJK public colleges, detail: "Applications for AJKMC, MBBSMC and PMC are taken online by the AJK Joint Admission Committee. Its site jac.ajk.gov.pk is not working, so follow announcements through the PMC admission cell (05824-960065), MBBSMC (05827-920453) and PM&DC. The last cycle's application fee was reported as Rs. 3,000 + Rs. 400 (secondary source)."}
      - {step: Also apply to federal colleges (SZABMU), detail: "AJK-domicile students compete on open merit AND on 2 AJK-quota seats each at Federal Medical College Islamabad and Shaikh Khalifa Bin Zayed College Lahore - http://www.szabmu.edu.pk/admission/mbbs-admission"}
      - {step: Merit and selection lists, detail: "Provisional merit list, then selection lists; college preferences cannot be changed after submission."}
      - {step: Join the college, detail: "Verify original documents, pay the fee and register with PM&DC (every admitted student must be registered)."}
    required_documents:
      - SSC certificate / result card (O-level needs IBCC equivalence)
      - HSSC (Pre-Medical) certificate / transcript (A-level needs IBCC equivalence)
      - PM&DC MDCAT result certificate
      - AJK State Subject certificate (Class-I) and domicile; Permanent Resident Certificate (PRC)
      - Proof of residence / property / education in the domicile region (required by SZABMU for domicile quotas)
      - Candidate's CNIC / Form-B and guardian's CNIC
      - Passport-size photographs with blue background (8 for PMC)
      - Paid application-fee challan (separate for MBBS and BDS at SZABMU)
      - Disability certificate from a government disability board (disabled quota only)
    eligibility: "HSSC/F.Sc. Pre-Medical (Biology + Chemistry compulsory, Physics or Maths) with at least 60%, and MDCAT at least 55% for MBBS / 50% for BDS."
    sources: ["https://pmdc.pk/Documents/law/Admissions%20Regulations-2025.pdf", "http://www.szabmu.edu.pk/admission/mbbs-admission", "https://pmcrajk.edu.pk/admission.php", "https://gotest.com.pk/admissions/ajk-mbbs-bds-admission-2025-joint-admission-committee/"]
    trust: official (PM&DC, SZABMU, PMC); JAC application fee secondary

