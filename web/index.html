<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK Assistance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#f5f7f4;--panel:#fff;--ink:#1c2420;--muted:#5d6a63;--line:#dde3dc;--accent:#0f6b4f;--accent-ink:#fff;--chip:#edf2ed;
  --pass:#1f7a3d;--fail:#b3261e;--pending:#8a6200;--check:#8a6200;--soon:#b7410e}
@media (prefers-color-scheme:dark){:root{--bg:#111513;--panel:#19201c;--ink:#e5ece8;--muted:#98a79f;--line:#2b3530;--accent:#3fb68b;--accent-ink:#07130d;
  --chip:#222b26;--pass:#62c98a;--fail:#f28b82;--pending:#e5c35a;--check:#e5c35a;--soon:#f08a5d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 6px}h3{font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pair{display:flex;align-items:center;gap:6px}.pair input{min-width:0}.pair .of{color:var(--muted);white-space:nowrap;font-size:13px}
.max{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.summary{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--chip);border-radius:10px;padding:10px 14px;min-width:120px}.stat b{font-size:22px;display:block}
.prog{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.verdict{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid}
.v-eligible{color:var(--pass)}.v-eligible_after_test{color:var(--pending)}.v-check_required{color:var(--check)}.v-not_eligible{color:var(--fail)}
table.checks{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}table.checks td,table.checks th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.checks th{color:var(--muted);font-weight:600}
.s-pass{color:var(--pass);font-weight:700}.s-fail{color:var(--fail);font-weight:700}.s-pending,.s-check{color:var(--pending);font-weight:700}
.chips span{display:inline-block;background:var(--chip);padding:2px 8px;border-radius:6px;margin:2px;font-size:12px}
.muted{color:var(--muted)}.small{font-size:13px}
ol.steps li{margin:6px 0}ul.docs{list-style:none;padding-left:0}ul.docs li{padding:3px 0}
.warn{border-left:4px solid var(--soon);background:var(--chip);padding:8px 12px;border-radius:6px;margin:8px 0}
.dl{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}.dl .d{font-weight:700;min-width:100px}
.days{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}.days.soon{background:var(--soon);color:#fff}.days.past{opacity:.6}
.testcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.big{font-size:28px;font-weight:800;color:var(--accent)}
#chatlog{min-height:280px;max-height:60vh;overflow:auto}.msg{margin:10px 0;padding:10px 14px;border-radius:10px;max-width:94%}
.msg.user{background:var(--chip);margin-left:auto}.msg.bot{border:1px solid var(--line)}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--muted);color:var(--muted)}
.suggest button{margin:3px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.cites{font-size:12px;color:var(--muted);margin-top:6px}.cites a{color:var(--muted)}
@media (max-width:600px){header,nav{padding:10px 16px}table.checks{font-size:12px}}
</style>
</head>
<body>
<header>
  <div><h1><span>JK</span> Assistance - Admissions</h1><div class="sub">Just finished 12th? Find where you can apply in AJK, check your eligibility, and follow the steps to enrol.</div></div>
  <div class="small muted" id="health">...</div>
</header>
<nav id="tabs">
  <button data-t="find" class="on">1. Find my programs</button><button data-t="apply">2. How to apply</button>
  <button data-t="tests">Entry tests</button><button data-t="dates">Admission dates</button><button data-t="chat">Ask a question</button>
</nav>
<main>
<section id="find" class="on">
  <div class="card">
    <h2>Your results</h2>
    <div class="row">
      <div><label>Intermediate group</label><select id="group"><option value="pre_med">F.Sc. Pre-Medical</option><option value="pre_eng">F.Sc. Pre-Engineering</option><option value="ics">ICS</option><option value="fa">F.A.</option><option value="icom">I.Com</option><option value="general_science">General Science</option><option value="dae">DAE</option><option value="a_level">A-level</option></select></div>
      <div><label>HSSC / FSc marks obtained</label><div class="pair"><input id="hssc_o" type="number" placeholder="e.g. 946"><span class="of">out of</span><input id="hssc_t" type="number" value="1100"></div></div>
      <div><label>Matric (SSC) marks obtained</label><div class="pair"><input id="ssc_o" type="number" placeholder="e.g. 1010"><span class="of">out of</span><input id="ssc_t" type="number" value="1100"></div></div>
    </div>
    <h2 style="margin-top:14px">Entry tests <span class="small muted">(leave blank if not taken yet)</span></h2>
    <div class="row">
      <div><label>MDCAT obtained <span class="max">max 180</span> <span class="small">MBBS ≥ 99 · BDS ≥ 90</span></label><input id="mdcat" type="number" min="0" max="180" placeholder="0 - 180"></div>
      <div><label>ECAT obtained <span class="max">max 400</span> <span class="small">PEC ≥ 132</span></label><input id="ecat" type="number" min="-100" max="400" placeholder="0 - 400"></div>
      <div><label>UAJK entry test <span class="max">pass 50%</span></label><div class="pair"><input id="uajk_o" type="number" placeholder="obtained"><span class="of">/</span><input id="uajk_t" type="number" placeholder="total"></div></div>
      <div><label>MUST SEET <span class="max">pass 33%</span></label><div class="pair"><input id="seet_o" type="number" placeholder="obtained"><span class="of">/</span><input id="seet_t" type="number" placeholder="total"></div></div>
      <div><label>HEC LAT (law) <span class="max">pass 50%</span></label><div class="pair"><input id="lat_o" type="number" placeholder="obtained"><span class="of">/</span><input id="lat_t" type="number" placeholder="total"></div></div>
    </div>
    <h2 style="margin-top:14px">What do you want?</h2>
    <div class="row">
      <div><label>Interests (optional)</label><select id="interest"><option value="">Show everything I can apply for</option><option value="medicine">Medicine (MBBS)</option><option value="dentistry">Dentistry (BDS)</option><option value="health">Health sciences (DPT, Pharm-D, nursing, allied)</option><option value="engineering">Engineering</option><option value="engineering_technology">Engineering Technology</option><option value="computing">Computing / IT / AI</option><option value="sciences">Natural sciences</option><option value="social_sciences">Social sciences & languages</option><option value="business">Business & commerce</option><option value="law">Law</option><option value="education">Education</option><option value="arts">Arts & design</option></select></div>
      <div><label>Where</label><select id="inst"><option value="">All (UAJK, MUST, medical)</option><option value="uajk">UAJK - Muzaffarabad</option><option value="must">MUST - Mirpur</option><option value="jac">AJK medical colleges</option><option value="szabmu">SZABMU federal colleges</option></select></div>
      <div><label>Age</label><input id="age" type="number" placeholder="e.g. 18"></div>
      <div><label>AJK State Subject?</label><select id="ss"><option value="true">Yes</option><option value="false">No</option></select></div>
      <div><label>Studied Mathematics?</label><select id="math"><option value="false">No</option><option value="true">Yes</option></select></div>
    </div>
    <p><button class="btn" id="go">Check my eligibility</button></p>
  </div>
  <div id="result"></div>
</section>

<section id="apply">
  <div class="card"><div class="row"><div><label>Institution</label><select id="applyInst"><option value="uajk">UAJK - University of Azad Jammu & Kashmir</option><option value="must">MUST - Mirpur University</option><option value="jac">MBBS / BDS (AJK medical colleges + SZABMU)</option></select></div></div></div>
  <div id="applyOut"></div>
</section>

<section id="tests"><div class="testcard" id="testCards"></div></section>

<section id="dates">
  <div class="card"><b>Admission dates</b> <span class="small muted" id="todayLbl"></span><div id="dateList"></div></div>
  <div class="card"><b>Rules to remember</b><div id="ruleList"></div></div>
</section>

<section id="chat">
  <div class="card suggest">
    <button>I did FSc pre-medical 946/1100, matric 1010/1100, MDCAT 140/180 - I want MBBS or DPT</button>
    <button>FSc pre-engineering 880/1100, ECAT 210 - engineering</button><button>ICS 64% computer science</button>
    <button>MDCAT passing marks</button><button>ECAT total marks</button><button>How do I apply to UAJK?</button>
    <button>How to apply for MBBS in AJK</button><button>UAJK last date</button>
  </div>
  <div class="card" id="chatlog"></div>
  <div class="card"><div style="display:flex;gap:8px"><input id="q" placeholder="Ask about admission, eligibility, MDCAT/ECAT, documents, fees or dates (English or Roman Urdu)"><button class="btn" id="send">Send</button></div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(u,o)=>{const r=await fetch(u,o?{headers:{'Content-Type':'application/json'},...o}:undefined);if(!r.ok)throw new Error(await r.text());return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'Rs. '+Number(n).toLocaleString('en-PK');
const V={eligible:'Eligible',eligible_after_test:'Eligible if you pass the test',check_required:'Check with the office',not_eligible:'Not eligible'};
const S={pass:'✓ pass',fail:'✗ fail',pending:'⏳ take test',check:'? check'};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('#tabs button,section').forEach(x=>x.classList.remove('on'));document.querySelector(`[data-t=${t}]`).classList.add('on');$('#'+t).classList.add('on');(loaders[t]||(()=>{}))()}

// ---------- find my programs
const num=id=>$(id).value===''?null:Number($(id).value);
const score=(o,t)=>num(o)===null?null:(num(t)?{obtained:num(o),total:num(t)}:num(o));
$('#go').onclick=async()=>{
  if(num('#hssc_o')===null){alert('Enter your HSSC / FSc marks');return}
  const tests={};const put=(k,v)=>{if(v!==null)tests[k]=v};
  put('mdcat',num('#mdcat')===null?null:{obtained:num('#mdcat'),total:180});put('ecat',num('#ecat')===null?null:{obtained:num('#ecat'),total:400});
  put('uajk_entry_test',score('#uajk_o','#uajk_t'));put('must_seet',score('#seet_o','#seet_t'));put('hec_lat',score('#lat_o','#lat_t'));
  const body={group:$('#group').value,hssc:score('#hssc_o','#hssc_t'),tests,state_subject:$('#ss').value==='true',studied_math:$('#math').value==='true'};
  const ssc=score('#ssc_o','#ssc_t');if(ssc!==null)body.ssc=ssc;if(num('#age'))body.age=num('#age');
  if($('#interest').value)body.interests=[$('#interest').value];if($('#inst').value)body.institutions=[$('#inst').value];
  $('#result').innerHTML='<div class="card muted">Checking...</div>';
  try{renderResult(await api('/api/advise',{method:'POST',body:JSON.stringify(body)}))}catch(e){$('#result').innerHTML=`<div class="card">Error: ${esc(e.message)}</div>`}
};
function renderResult(r){
  const open=r.programs.filter(p=>p.eligibility!=='not_eligible'), ready=r.programs.filter(p=>p.eligibility==='eligible');
  const next=Object.values(r.how_to_apply).flatMap(h=>h.dates).filter(d=>d.days_left>=0).sort((a,b)=>a.days_left-b.days_left)[0];
  const pr=r.profile;
  let h=`<div class="card"><h2>Summary</h2><div class="summary">
    <div class="stat"><b>${pr.hssc_percent}%</b>HSSC</div>${pr.ssc_percent!=null?`<div class="stat"><b>${pr.ssc_percent}%</b>SSC</div>`:''}
    ${Object.entries(pr.tests||{}).map(([k,v])=>`<div class="stat"><b>${v.obtained!=null&&v.total?`${v.obtained}/${v.total}`:v.percent+'%'}</b>${k.toUpperCase().replace('_',' ')}</div>`).join('')}
    <div class="stat"><b>${open.length}</b>programs open to you</div><div class="stat"><b>${ready.length}</b>ready now (no test pending)</div>
    ${next?`<div class="stat"><b>${next.days_left} days</b>${esc(next.title)}</div>`:''}</div>
    ${!pr.interests&&r.fields_open_to_you.length?`<p class="small"><b>Fields open to you:</b> ${r.fields_open_to_you.map(f=>`${esc(f.label)} (${f.programs})`).join(' · ')}</p>`:''}</div>`;
  h+=`<div class="card"><h2>Programs</h2>${r.programs.map(progHtml).join('')||'<p>No programs match these filters.</p>'}<p class="small muted">${esc(r.chance_note)}</p></div>`;
  h+=Object.values(r.how_to_apply).map(x=>`<div class="card">${howHtml(x,true)}</div>`).join('');
  $('#result').innerHTML=h;$('#result').scrollIntoView({behavior:'smooth'});
}
function progHtml(p){
  const fee=p.fees?`<span>1st semester ${rs(p.fees.first_semester)} (${esc(p.fees.session)})</span>${p.fees.open_merit_first_semester?`<span>self-finance ${rs(p.fees.open_merit_first_semester)}</span>`:''}${p.fees.self_support_per_semester?`<span>self-support +${rs(p.fees.self_support_per_semester)}/sem</span>`:''}`:'<span>fee not published</span>';
  return `<div class="prog"><h3>${esc(p.program)}</h3>
   <div class="small muted">${p.institution.toUpperCase()} · ${esc(p.campus||'')} · ${p.years||'?'} years</div>
   <div style="margin:6px 0"><span class="verdict v-${p.eligibility}">${V[p.eligibility]}</span> <span class="small">Chance: <b>${esc(p.chance)}</b></span></div>
   <div class="chips">${fee}${p.seats?`<span>${esc(p.seats)}</span>`:''}</div>
   <table class="checks"><tr><th>Requirement</th><th>Needed</th><th>You</th><th></th></tr>
   ${p.checks.map(c=>`<tr><td>${esc(c.criterion)}${c.any_of?' <span class="small muted">(any one test)</span>':''}${c.note?`<div class="small muted">${esc(c.note)}</div>`:''}</td><td>${esc(c.required)}</td><td>${esc(c.yours)}</td><td class="s-${c.status}">${S[c.status]}</td></tr>`).join('')}</table>
   ${p.note?`<div class="small muted" style="margin-top:6px">${esc(p.note)}</div>`:''}</div>`;
}
// ---------- how to apply
function howHtml(h,compact){
  let s=`<h2>How to apply - ${esc(h.institution)}</h2>`;
  if(h.website_status) s+=`<div class="warn"><b>⚠️ ${esc(h.website_status)}</b><ul>${(h.working_channels||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  else if(h.portal) s+=`<p>Portal: <a href="${esc(h.portal)}" target="_blank">${esc(h.portal)}</a></p>`;
  s+=`<ol class="steps">${h.steps.map(x=>`<li><b>${esc(x.step)}</b> - ${esc(x.detail)}</li>`).join('')}</ol>`;
  s+=`<b>Documents checklist</b><ul class="docs">${h.required_documents.map(d=>`<li><label style="display:inline;color:inherit"><input type="checkbox" style="width:auto"> ${esc(d)}</label></li>`).join('')}</ul>`;
  const dates=h.dates.filter(d=>d.days_left>=-7);
  if(dates.length) s+=`<b>Dates</b>${dates.map(dateRow).join('')}`;
  if(!compact){for(const k of ['eligibility','age_limit','reserved_seats','scholarships','fee_rules','refund']) if(h[k]) s+=`<p class="small"><b>${k.replace('_',' ')}:</b> ${esc(h[k])}</p>`;
    if(h.contacts?.length) s+=`<p class="small"><b>Contact:</b> ${h.contacts.map(c=>esc(`${c.office} ${c.phone||''} ${c.email||''}`)).join(' · ')}</p>`;
    if(h.sources?.length) s+=`<p class="small muted">Sources: ${h.sources.map(u=>`<a href="${esc(u)}" target="_blank">${esc(u)}</a>`).join(', ')}</p>`}
  return s;
}
async function loadApply(){$('#applyOut').innerHTML=`<div class="card">${howHtml(await api('/api/how-to-apply/'+$('#applyInst').value),false)}</div>`}
$('#applyInst').onchange=loadApply;
// ---------- tests
async function loadTests(){const ts=await api('/api/tests');
  $('#testCards').innerHTML=ts.map(t=>`<div class="card"><h2>${esc(t.name)}</h2>
   <div>${t.max_marks?`<span class="big">${t.max_marks}</span> <span class="muted">total marks</span>`:'<span class="muted">Total marks: shown on your result card</span>'}</div>
   ${Object.entries(t.passing||{}).map(([k,v])=>typeof v==='object'?`<div><b>${k.replace('_',' ')}:</b> ≥ ${v.percent}%${v.marks?` = <b>${v.marks} / ${t.max_marks}</b>`:''}</div>`:`<div class="small muted">${esc(v)}</div>`).join('')}
   ${t.format?`<p class="small">${esc(t.format)}</p>`:''}${t.fee?`<p class="small"><b>Fee:</b> ${esc(t.fee)}</p>`:''}${t.dates_2026?`<p class="small"><b>2026:</b> ${esc(t.dates_2026)}</p>`:''}
   ${t.merit_formula?`<p class="small"><b>Merit:</b> MDCAT ${t.merit_formula.mdcat}% + HSSC ${t.merit_formula.hssc}% + SSC ${t.merit_formula.ssc}%</p>`:''}
   ${t.reference_averages_fall_2026_first?`<p class="small"><b>Average (Fall 2026, first ECAT):</b> pre-eng ${t.reference_averages_fall_2026_first.pre_eng}, ICS ${t.reference_averages_fall_2026_first.ics}, pre-med ${t.reference_averages_fall_2026_first.pre_med} / 400</p>`:''}
   ${t.conducted_for_ajk_by?`<p class="small">${esc(t.conducted_for_ajk_by)}</p>`:''}${t.use_in_ajk?`<p class="small">${esc(t.use_in_ajk)}</p>`:''}${t.note?`<p class="small">${esc(t.note)}</p>`:''}
   ${(t.registration||t.portal)?`<p class="small"><a href="${esc(t.registration||t.portal)}" target="_blank">Register / portal</a></p>`:''}</div>`).join('')}
// ---------- dates
const dateRow=d=>`<div class="dl"><span class="d">${d.date}</span><span class="days ${d.days_left<0?'past':d.days_left<=14?'soon':''}">${d.days_left<0?'passed':d.days_left===0?'today':d.days_left+' days'}</span><span>${esc(d.title)}${d.trust==='secondary'?' <span class="small muted">(third-party, verify)</span>':''}${d.action?`<div class="small muted">${esc(d.action)}</div>`:''}</span></div>`;
async function loadDates(){const r=await api('/api/deadlines?include_past_days=120');$('#todayLbl').textContent='(today '+r.today+')';
  const up=r.dated.filter(d=>d.days_left>=0), past=r.dated.filter(d=>d.days_left<0).reverse();
  $('#dateList').innerHTML=(up.length?`<h3 style="margin-top:8px">Coming up</h3>${up.map(dateRow).join('')}`:'')+(past.length?`<h3 style="margin-top:14px" class="muted">Recently passed</h3>${past.map(dateRow).join('')}`:'');$('#ruleList').innerHTML=r.rules.map(x=>`<div class="dl"><span class="d">${x.institution.toUpperCase()}</span><span><b>${esc(x.title)}</b> - ${esc(x.rule)}</span></div>`).join('')}
// ---------- chat
async function ask(text){if(!text.trim())return;$('#chatlog').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(text)}</div>`);$('#q').value='';
  const id='m'+Date.now();$('#chatlog').insertAdjacentHTML('beforeend',`<div class="msg bot" id="${id}"><span class="muted">Checking...</span></div>`);
  try{const r=await api('/api/chat',{method:'POST',body:JSON.stringify({message:text})});
    $('#'+id).innerHTML=`<span class="pill">${r.action}</span> <span class="small muted">${r.intent}</span>${marked.parse(r.answer)}<details class="cites"><summary>Sources</summary>${r.citations.map(c=>`[${c.n}] ${c.source.startsWith('http')?`<a href="${esc(c.source)}" target="_blank">${esc(c.source)}</a>`:esc(c.source)}${c.trust==='secondary'?' (third-party, verify)':''}`).join('<br>')}</details>`;
  }catch(e){$('#'+id).textContent='Error: '+e.message}$('#chatlog').scrollTop=1e9}
$('#send').onclick=()=>ask($('#q').value);$('#q').onkeydown=e=>{if(e.key==='Enter')ask($('#q').value)};
document.querySelectorAll('.suggest button').forEach(b=>b.onclick=()=>ask(b.textContent));

const loaders={apply:loadApply,tests:loadTests,dates:loadDates};
api('/api/health').then(h=>$('#health').textContent=`Today ${h.today} · ${h.programs} programs · ${h.llm?'Claude answers on':'rule-engine answers'}`);
</script>
</body>
</html>
