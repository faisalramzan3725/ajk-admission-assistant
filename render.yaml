# Render Blueprint - free web service, redeploys automatically on every push to main.
# Render dashboard -> New -> Blueprint -> pick the GitHub repo (private repos work once Render is authorised on GitHub).
services:
  - type: web
    name: ajk-admission-assistant
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY   # optional - leave empty for rule-engine answers
        sync: false
      - key: JK_MODEL
        value: claude-opus-5-5
      - key: JK_EFFORT
        value: medium
